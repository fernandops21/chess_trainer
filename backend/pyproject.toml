[project]
name = "chess-trainer"
version = "0.1.0"
description = "Treino de xadrez: puzzles dos seus próprios erros com repetição espaçada"
requires-python = ">=3.12"
dependencies = [
  "chess>=1.11",
  "sqlalchemy>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "zstandard>=0.23",
  "anthropic>=1.5",
  "fastembed>=0.8",
  "sqlite-vec>=0.1.9",
  "langfuse>=4",
  "numpy>=1.26",
]

[dependency-groups]
dev = ["jsonschema>=4.26", "pytest>=8", "pytest-timeout>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: precisa do Stockfish real"]
timeout = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chess_trainer"]
